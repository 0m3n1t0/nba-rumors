name: Collect NBA news

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and rank headlines
        run: python src/collect.py

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: topics
          path: data/
          retention-days: 7
