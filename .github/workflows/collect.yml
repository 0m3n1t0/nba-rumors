name: NBA pipeline

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Stage 1: collect and rank headlines"
        run: python src/collect.py

      - name: "Stage 1b: audience signals (YouTube views + search)"
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/signals.py

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Stage 2: AI editor picks today's stories"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python src/editor.py

      - name: "Stage 3: write scripts (youtube-agent-skill hooks + titles)"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python src/script.py

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-v1

      - name: Install voice engine
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt

      - name: "Stage 4: voice (Kokoro, chosen voice #11)"
        run: python src/tts.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data
          path: data/
          retention-days: 7
