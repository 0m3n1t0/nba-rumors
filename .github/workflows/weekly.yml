name: Weekly skills

on:
  schedule:
    - cron: "43 6 * * 1"   # every Monday, 06:43 UTC (10:43 in Tbilisi)
  workflow_dispatch:

permissions:
  contents: read   # nothing is written to this public repository any more (no commits, no Issues)

# shares the Claude limit with the daily pipeline: never runs at the same time as it
concurrency:
  group: claude-pipeline
  cancel-in-progress: false

env:
  CHANNEL: nba
  # Claude Code is PINNED (owner's decision 2026-11-11): a new release can never change a run
  # unseen. Claude checks the newest version once a month and proposes the update in chat.
  CLAUDE_CODE_VERSION: "2.1.322"
  DISABLE_AUTOUPDATER: "1"   # and it never updates itself during a run

jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Private state repository (plan, competitor scan and reports are kept there)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: 0m3n1t0/nba-rumors-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the channel's history
        run: python src/state.py restore

      - name: Today's stories and audience signals (for the plan)
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}   # optional: Wikimedia limits per account, not per shared IP
        run: |
          python src/collect.py
          python src/signals.py

      - name: Competitor scan (benchmark + yt-viral), for the daily editor and script
        continue-on-error: true
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/benchmark.py

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: "yt-plan, yt-audit, yt-retention"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/weekly.py

      - name: Save the plan, the competitor scan and the report to the private repository
        if: always()
        env:
          SAVE_PLAN: "1"
        run: python src/state.py save
