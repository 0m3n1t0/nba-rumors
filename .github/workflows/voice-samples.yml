name: Voice audition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-chatterbox-v2

      - name: Cache the voice engine's English model (so it is downloaded only once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-wheels
          key: voice-wheels-v1

      - name: Install voice engines (Kokoro + Chatterbox + Chatterbox Turbo, CPU)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "chatterbox-tts==0.1.7"
          pip install "kokoro>=0.9" soundfile
          python src/install_voice_model.py

      - name: Record the audition samples
        run: python src/voice_audition.py

      - name: Save samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
          retention-days: 7
