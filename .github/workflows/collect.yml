name: NBA pipeline

on:
  schedule:
    # 2 runs a day, 2 Shorts each = 4 Shorts a day. 12:17 and 22:17 UTC (morning and late
    # afternoon in the US). The second channel runs at 03:17 and 17:17, so every run gets its
    # own 5-hour Claude Pro window (runs are always 5 or more hours apart).
    - cron: "17 12,22 * * *"
  workflow_dispatch:          # "Run workflow" button for manual tests

# This repository is public, so the run's Summary page is SHORT (how many Shorts, the gate's
# verdicts): every stage writes its full section into data/summary.md instead, and that full
# report goes to the PRIVATE state repository with the working data (nba/runs/, 14 days).
# (Owner's decision, 2026-11-11.)
permissions:
  contents: read

# One Claude-heavy run at a time: a manual run started while another is going waits for it
# (two runs at once would pick the same story and spend the Claude limit twice).
concurrency:
  group: claude-pipeline
  cancel-in-progress: false

env:
  CHANNEL: nba                 # this channel's folder in the private state repository
  SHORTS_PER_RUN: "2"          # Shorts made per run
  CLAUDE_MODEL: sonnet         # writing, judging, choosing pictures (Opus would use the plan 5x faster)
  CLAUDE_MODEL_LIGHT: haiku    # simple steps (trimming, search words)
  MUSIC_UNDER_DB: "14"         # background music this many dB under the voice (14 = clearly audible, voice stays on top)

jobs:
  pipeline:
    runs-on: ubuntu-24.04      # pinned: "ubuntu-latest" is moving to Ubuntu 26, which could change ffmpeg/espeak
    timeout-minutes: 120     # Chatterbox voices on a CPU: a few extra minutes per Short
    steps:
      - uses: actions/checkout@v5

      - name: Story history (what was already made, kept between runs)
        uses: actions/cache@v5
        with:
          path: data/history
          key: story-history-${{ github.run_id }}
          restore-keys: story-history-

      - name: Private state repository (permanent history and licence records)
        continue-on-error: true      # without it the run still works from the cache
        uses: actions/checkout@v5
        with:
          repository: 0m3n1t0/nba-rumors-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # Chatterbox (the voice) needs 3.11
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safety tests (monetization checks must work before anything is made)
        run: python -m unittest discover -s tests

      - name: Restore the channel's history (private repository wins over the cache)
        run: python src/state.py restore

      - name: "Stage 1: collect and rank headlines"
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/collect.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: "Stage 1b: audience signals (YouTube views + search)"
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/signals.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Stage 2: AI editor picks today's stories"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/editor.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: "Stage 3: write scripts (youtube-agent-skill hooks + titles)"
        if: hashFiles('data/skip_reason.txt') == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}   # official NBA results (only confirms claims)
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/script.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: Cache voice models
        if: hashFiles('data/skip_reason.txt') == ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: voice-models-pipeline-v2
          restore-keys: voice-models-chatterbox-v2   # the audition already downloaded Chatterbox

      - name: Cache the voice engine's English model (so it is downloaded only once)
        if: hashFiles('data/skip_reason.txt') == ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/voice-wheels
          key: voice-wheels-v1

      - name: Install voice engine
        if: hashFiles('data/skip_reason.txt') == ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt
          # English model for the voice engine: from the cache, else Hugging Face, else GitHub
          python src/install_voice_model.py

      - name: "Stage 4: voice (voice #11, performed by Chatterbox; Kokoro if it fails)"
        if: hashFiles('data/skip_reason.txt') == ''
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/tts.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: "Stage 4b: yt-edit (cut dead air in the narration)"
        if: hashFiles('data/skip_reason.txt') == ''
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/audio_qc.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: "Long-video skills: yt-chapters + yt-shorts (sleep until a long video exists)"
        if: hashFiles('data/skip_reason.txt') == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/long_tools.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: Music library (private repo with YouTube Audio Library tracks; skipped if not set up)
        if: hashFiles('data/skip_reason.txt') == ''
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: 0m3n1t0/music-library
          token: ${{ secrets.MUSIC_REPO_TOKEN }}
          path: music_library

      - name: "Stage 4c: real visuals (all free sources searched, AI picks and crops the best)"
        if: hashFiles('data/skip_reason.txt') == ''
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/media.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: "Stage 5: render the Shorts (MP4)"
        if: hashFiles('data/skip_reason.txt') == ''
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/render.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: "Stage 6: publication gate (PASS / REVIEW / REJECT)"
        if: hashFiles('data/skip_reason.txt') == ''
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/gate.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: Budget table (Claude use this run)
        if: always()
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/stage_summary.md"; : > "$GITHUB_STEP_SUMMARY"   # full report: private only
          python src/budget.py || status=$?
          mkdir -p data && cat "$GITHUB_STEP_SUMMARY" >> data/summary.md 2>/dev/null || true
          exit ${status:-0}

      - name: Public summary (short; the full report is private)
        if: always()
        continue-on-error: true
        run: python src/public_summary.py

      - name: Save the channel's history and this run's full report to the private repository
        if: always()
        continue-on-error: true
        env:
          SAVE_RUN_REPORT: "1"
        run: python src/state.py save

      - name: "Download 1: finished Shorts only (small)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-ready
          path: |
            data/video/short_*.mp4
            data/video/short_*_thumb.png
          if-no-files-found: warn
          retention-days: 1   # public repository: downloadable by GitHub users, so kept 1 day only
