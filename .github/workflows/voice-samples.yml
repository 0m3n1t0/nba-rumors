name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install voice engine (Kokoro, CPU)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9" soundfile numpy

      - name: Record samples
        run: python src/voice_samples.py

      - name: Save samples
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
          retention-days: 7
